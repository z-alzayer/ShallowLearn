[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ShallowLearn"
version = "0.1.0"
description = "Shallow water remote sensing package"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "z-z", email = "zba21@ic.ac.uk"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["remote sensing", "satellite imagery", "machine learning", "coral reefs", "shallow water"]
requires-python = ">=3.10"

# Core dependencies
# Note: GDAL requires system libraries - install with: sudo apt install gdal-bin libgdal-dev
dependencies = [
    "numpy>=1.25.0,<2.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "opencv-python>=4.8.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "tqdm>=4.64.0",
    "seaborn>=0.12.0",
    "pillow>=9.5.0",
    "gdal>=3.6.0,<4.0.0",  # Version depends on system GDAL
    "cdsetool",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "reorder-python-imports>=3.10.0",
]

# Documentation dependencies
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",
    "mkdocstrings[python]>=0.22.0",
]

# Testing dependencies
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-xdist>=3.3.0",  # For parallel testing
]

# All optional dependencies
all = [
    "ShallowLearn[dev,docs,test]"
]

[project.urls]
"Homepage" = "https://github.com/z-alzayer/ShallowLearn"
"Bug Reports" = "https://github.com/z-alzayer/ShallowLearn/issues"
"Source" = "https://github.com/z-alzayer/ShallowLearn"
"Documentation" = "https://z-alzayer.github.io/ShallowLearn/"

[tool.setuptools.packages.find]
include = ["ShallowLearn*"]

[tool.setuptools.package-data]
"ShallowLearn" = ["Data/Clear_Reefs.csv"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --disable-warnings"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning:numpy.*",
]

# Coverage configuration
[tool.coverage.run]
source = ["ShallowLearn"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true once types are added
ignore_missing_imports = true

# Flake8 configuration (via setup.cfg or .flake8, but documented here)
# max-line-length = 88
# extend-ignore = E203, W503