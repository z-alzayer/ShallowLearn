[project]
name = "shallowlearn-tutorials"
version = "1.0.0"
description = "Worked notebooks for the methods chapters of the ShallowLearn PhD thesis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "pillow>=9.5",
    "jupyter>=1.0",
]

# Only needed to regenerate data/*.npy from raw Sentinel-2 products.
[project.optional-dependencies]
data = ["rasterio>=1.3"]

[tool.uv]
package = false
