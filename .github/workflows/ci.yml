
name: Python Package CI

on:
  push:
    branches: [ master, main, code_refactor ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Use official GDAL container with GDAL pre-installed
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.8.5
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Python and build tools
      run: |
        apt-get update
        apt-get install -y python3-pip python3-venv python3-dev build-essential git

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true  # Enable uv's built-in caching
      env:
        UV_CACHE_DIR: /tmp/.uv-cache  # Container-friendly cache location

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Get GDAL version for cache key
      id: gdal-version
      run: |
        GDAL_VERSION=$(gdal-config --version)
        echo "version=$GDAL_VERSION" >> $GITHUB_OUTPUT

    - name: Cache Python environment
      uses: actions/cache@v4
      id: cache-venv
      with:
        path: .venv
        key: venv-container-py${{ matrix.python-version }}-gdal${{ steps.gdal-version.outputs.version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          venv-container-py${{ matrix.python-version }}-gdal${{ steps.gdal-version.outputs.version }}-

    - name: Create virtual environment and install dependencies
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        uv venv --python ${{ matrix.python-version }}
        
        # Get system GDAL version and install matching Python bindings first
        GDAL_VERSION=$(gdal-config --version)
        echo "System GDAL version: $GDAL_VERSION"
        uv pip install "gdal==$GDAL_VERSION"
        
        # Install package with all other dependencies
        uv pip install -e ".[dev,test]"

    - name: Install package in editable mode (always needed for -e)
      if: steps.cache-venv.outputs.cache-hit == 'true'
      run: |
        # Even with cache, we need to reinstall in editable mode
        uv pip install -e . --no-deps

    - name: Verify installation
      run: |
        uv run python -c "import ShallowLearn; print('✅ ShallowLearn imported successfully')"
        uv run python -c "from osgeo import gdal; print('✅ GDAL version:', gdal.__version__)"
        uv run python -c "import rasterio; print('✅ Rasterio available')"
        uv run python -c "import geopandas; print('✅ GeoPandas available')"

    - name: Run tests with coverage
      run: |
        # Run tests and continue even if some fail, so coverage is generated
        uv run pytest tests/ \
          --ignore=tests/test_modular_structure.py \
          --ignore=tests/test_end_to_end_pipelines.py \
          --ignore=tests/test_io_module.py \
          --cov=ShallowLearn \
          --cov-report=xml \
          --cov-report=term-missing \
          --tb=short \
          --continue-on-collection-errors || true

    - name: Check coverage file exists
      run: |
        if [ -f "coverage.xml" ]; then
          echo "✅ Coverage file exists"
          ls -la coverage.xml
          head -10 coverage.xml
        else
          echo "❌ Coverage file not found"
          ls -la
        fi
        
        # Ensure git info is available for codecov
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        echo "Git info:"
        git log -1 --oneline
        echo "Current branch: $(git branch --show-current || echo 'detached')"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always()  # Upload even if tests failed
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
        # Explicit git info for container environment
        override_branch: ${{ github.ref_name }}
        override_commit: ${{ github.sha }}
        override_pr: ${{ github.event.pull_request.number }}
        override_build: ${{ github.run_id }}
